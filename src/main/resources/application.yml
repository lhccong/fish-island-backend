# 公共配置文件
# @author <a href="https://github.com/lhccong">程序员聪</a>
spring:
  application:
    name: fish-island-backend
  # 默认 dev 环境
  profiles:
    active: pre
  # 支持 swagger3
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  # 文件上传
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
server:
  address: 0.0.0.0
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    ## 打印 sql 日志（线上时可关闭）
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）
# 接口文档配置
knife4j:
  enable: true
  openapi:
    title: "接口文档"
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.cong.fishisland.controller
# 滑动验证，底图路径，不配置将使用默认图片
# 支持全路径
# 支持项目路径,以classpath:开头,取resource目录下路径,例：classpath:images/jigsaw
aj:
  captcha:
    #    jigsaw: "classpath:images/jigsaw"
    #滑动验证，底图路径，不配置将使用默认图片
    ##支持全路径
    # 支持项目路径,以classpath:开头,取resource目录下路径,例：classpath:images/pic-click
    #    pic-click: "classpath:images/pic-click"

    # 对于分布式部署的应用，我们建议应用自己实现CaptchaCacheService，比如用Redis或者memcache，
    # 参考CaptchaCacheServiceRedisImpl.java
    # 如果应用是单点的，也没有使用redis，那默认使用内存。
    # 内存缓存只适合单节点部署的应用，否则验证码生产与验证在节点之间信息不同步，导致失败。
    # ！！！ 注意啦，如果应用有使用spring-boot-starter-data-redis，
    # 请打开CaptchaCacheServiceRedisImpl.java注释。
    # redis ----->  SPI： 在resources目录新建META-INF.services文件夹(两层)，参考当前服务resources。
    # 缓存local/redis...
    cache-type: redis
    # local缓存的阈值,达到这个值，清除缓存
    cache-number: 1000
    # local定时清除过期缓存(单位秒),设置为0代表不执行
    timing-clear: 180
    #spring.redis.host: 10.108.11.46
    #spring.redis.port: 6379
    #spring.redis.password:
    #spring.redis.database: 2
    #spring.redis.timeout: 6000

    # 验证码类型default两种都实例化。
    type: BLOCKPUZZLE
    # 汉字统一使用Unicode,保证程序通过@value读取到是中文，可通过这个在线转换;yml格式不需要转换
    # https://tool.chinaz.com/tools/unicode.aspx 中文转Unicode
    # 右下角水印文字(我的水印)
    water-mark: "摸鱼岛"
    # 右下角水印字体(不配置时，默认使用文泉驿正黑)
    # 由于宋体等涉及到版权，我们jar中内置了开源字体【文泉驿正黑】
    # 方式一：直接配置OS层的现有的字体名称，比如：宋体
    # 方式二：自定义特定字体，请将字体放到工程resources下fonts文件夹，支持ttf\ttc\otf字体
    #water-font: WenQuanZhengHei.ttf
    # 点选文字验证码的文字字体(文泉驿正黑)
    #font-type: WenQuanZhengHei.ttf
    # 校验滑动拼图允许误差偏移量(默认5像素)
    slip-offset: 5
    # aes加密坐标开启或者禁用(true|false)
    aes-status: true
    # 滑动干扰项(0/1/2)
    interference-options: 2

    #点选字体样式 默认Font.BOLD
    font-style: 1
    #点选字体字体大小
    font-size: 25
    #点选文字个数,存在问题，暂不支持修改
    #click-word-count: 4

    history-data-clear-enable: false

    # 接口请求次数一分钟限制是否开启 true|false
    req-frequency-limit-enable: false
    # 验证失败5次，get接口锁定
    req-get-lock-limit: 5
    # 验证失败后，锁定时间间隔,s
    req-get-lock-seconds: 360
    # get接口一分钟内请求数限制
    req-get-minute-limit: 30
    # check接口一分钟内请求数限制
    req-check-minute-limit: 60
    # verify接口一分钟内请求数限制
    req-verify-minute-limit: 60
minio:
  endpoint: http://127.0.0.1:9000 #minio地址
  accessKey: minioadmin #账号
  secretKey: minioadmin #密码
  bucketName: fish #桶名称

# 热榜数据源相关配置（按需配置）
fishisland:
  koishi:
    ws-url: ws://127.0.0.1:5140/status
    # 摸鱼助手 Token 优先从数据源 Cookie 表（dataSourceKey=Koishi）读取，此处仅作兜底
    token: mock-token
    platform: sandbox:mock
    default-user: Eve
    channel: "#"
    reply-timeout-seconds: 3
    connect-timeout-seconds: 15
    reconnect-delay-seconds: 3
  pet:
    forge:
      # 数值计算是否计入项链(5)、翅膀(6)的锻造等级与词条；暂无实体装备时建议 false
      include-necklace-wings-stats: false
  tournament:
    # 武道大会每日排行结算总积分池（按排名百分比分配，规则同 Boss）
    reward-points: 400
  nudenet:
    # 是否启用 NudeNet 图片内容检测
    enabled: true
    infer-url: http://localhost:8080/infer
    score-threshold: 0.4
    # 检测服务异常时是否放行上传
    fail-open: true
    timeout-seconds: 15
    notify-user-id: 1
    blocked-classes:
      - FEMALE_BREAST_EXPOSED
      - FEMALE_GENITALIA_EXPOSED
      - MALE_GENITALIA_EXPOSED
      - MALE_BREAST_EXPOSED
      - BUTTOCKS_EXPOSED
      - ANUS_EXPOSED
      - BELLY_EXPOSED
  datasource:
    nga:
      # 可选：访客 Cookie 等，部分网络环境访问 NGA 需要；勿将含登录态的 Cookie 写入仓库或提交版本控制
